name: Submit dependency graph

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Supply the build identity so configuration never shells out to git.
    env:
      GIT_COMMIT_SHA: ${{ github.sha }}
      BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
    # github.com's dependency submission API is the only thing that needs a
    # write token here; the job never touches git history or release assets.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android

      # Gradle manifests are not parsed into a dependency graph automatically, so
      # the pull-request dependency review has nothing to inspect without this.
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
