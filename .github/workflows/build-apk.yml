name: Build NetGate APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes an older build pointless, so cancel it
# instead of letting stale runs queue up and hold a runner.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # Bounds a hung Gradle download or daemon instead of the 6h default.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android

      - name: Run Android lint
        run: gradle :app:lintDebug

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: warn

      - name: Build Debug APK
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          export BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NetGate-debug-apk
          # ABI splits are enabled for every variant, so this includes the universal
          # debug APK (app-universal-debug.apk) plus one APK per architecture.
          path: app/build/outputs/apk/debug/*.apk
