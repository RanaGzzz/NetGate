name: Set up Android build environment
description: >
  Installs the JDK and Gradle versions NetGate builds with, creates the empty
  .env the Secrets plugin expects, and generates the throwaway debug keystore
  used by debug builds and Robolectric tests. Shared by the APK and release
  workflows so the two pipelines cannot drift apart.

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle 9.3.1
      uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      with:
        gradle-version: '9.3.1'

    - name: Prepare env
      shell: bash
      run: touch .env

    - name: Generate debug signing keystore
      shell: bash
      run: |
        keytool -genkeypair \
          -v \
          -keystore debug.keystore \
          -storepass android \
          -keypass android \
          -alias androiddebugkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"
